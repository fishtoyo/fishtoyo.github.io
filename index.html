<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fish</title>
    <meta name="description" content="Fish 的個人網站：個人履歷，以及 Fish Studio 網站設計與前端開發工作室。" />
    <meta name="author" content="Fish" />
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico" />
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
    <meta property="og:title" content="Fish" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://fishtoyo.github.io/assets/og_image.jpg" />
    <link rel="canonical" href="https://fishtoyo.github.io/" />

    <script>
      // 舊的履歷分享連結（例如 /?lang=zh）直接轉到 /resume/
      if (/[?&]lang=/.test(location.search)) location.replace('/resume/' + location.search + location.hash);
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&family=Noto+Sans+TC:wght@500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
    <style>
      :root {
        --navy: #082642;
        --navy-2: #164e81;
        --accent: #49c5e4;
      }
      * { box-sizing: border-box; margin: 0; }
      body {
        min-height: 100vh;
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 48px;
        padding: 48px 16px;
        background: linear-gradient(155deg, var(--navy-2) 0%, var(--navy) 60%);
        color: #fff;
        font-family: "Quicksand", "Noto Sans TC", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .logo { width: 129px; height: auto; display: block; }
      .cards {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 24px;
        width: 100%;
        max-width: 760px;
      }
      .card {
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 32px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.06);
        color: inherit;
        text-decoration: none;
        transition: transform 0.25s ease, background 0.25s ease, border-color 0.25s ease;
      }
      .card:hover, .card:focus-visible {
        transform: translateY(-4px);
        background: rgba(255, 255, 255, 0.1);
        border-color: rgba(73, 197, 228, 0.6);
        outline: none;
      }
      .icon {
        font-family: "Material Symbols Outlined";
        font-size: 36px;
        line-height: 1;
        color: var(--accent);
      }
      .eyebrow {
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: var(--accent);
      }
      .card h2 { font-size: 26px; font-weight: 700; }
      .card p { font-size: 15px; line-height: 1.7; color: rgba(255, 255, 255, 0.72); }
      .go {
        margin-top: auto;
        padding-top: 8px;
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 15px;
        font-weight: 700;
      }
      .go .icon { font-size: 20px; color: inherit; transition: transform 0.25s ease; }
      .card:hover .go .icon { transform: translateX(4px); }
      footer { font-size: 13px; color: rgba(255, 255, 255, 0.45); }
      @media (max-width: 640px) {
        .cards { grid-template-columns: 1fr; }
        .card { padding: 24px; }
      }
      @media (prefers-reduced-motion: reduce) {
        .card, .go .icon { transition: none; }
      }
    </style>
  </head>
  <body>
    <img class="logo" src="/assets/logo.png" alt="FISH" />

    <main class="cards">
      <a class="card" href="/resume/">
        <span class="icon" aria-hidden="true">badge</span>
        <span class="eyebrow">Resume</span>
        <h2>個人履歷</h2>
        <p>16 年前端開發經歷、技能與歷年參與製作的專案。</p>
        <span class="go">查看履歷 <span class="icon" aria-hidden="true">arrow_forward</span></span>
      </a>
      <a class="card" href="/studio/">
        <span class="icon" aria-hidden="true">storefront</span>
        <span class="eyebrow">Fish Studio</span>
        <h2>工作室</h2>
        <p>網站設計與前端開發服務，以及自主開發的產品作品。</p>
        <span class="go">前往工作室 <span class="icon" aria-hidden="true">arrow_forward</span></span>
      </a>
    </main>

    <footer>© Fish</footer>
  </body>
</html>
